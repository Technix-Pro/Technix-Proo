<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080b14" />
  <title>TechnixPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app-config.js"></script>
  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="admin-core.js"></script>
  <script src="engagement.js"></script>
  <script src="effects.js"></script>
  <script src="payments.js"></script>
  <script src="backend-adapter.js"></script>
  <script src="data.js"></script>
  <script src="rig-builder.js"></script>
  <script src="admin-monetization.js"></script>
  <script src="admin-ui.js"></script>
  <script src="engagement-ui.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="toast" class="floating-toast" role="status" aria-live="polite"></div>
  <main class="max-w-md mx-auto w-full min-h-screen flex flex-col relative pb-24">
    <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-[#080b14]/90 backdrop-blur-xl border-b border-slate-800/80">
      <div class="flex items-center gap-3 min-w-0">
        <button id="header-avatar" type="button" aria-label="Profil" class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center font-black text-cyan-300"></button>
        <div class="min-w-0">
          <h1 id="header-title" class="text-base font-bold text-white truncate">TechnixPro</h1>
          <p id="header-sub" class="text-[11px] text-slate-400 truncate"></p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="header-clicker" type="button" class="hidden text-xs font-bold text-amber-200 bg-amber-500/10 border border-amber-500/30 rounded-full px-2.5 py-1 whitespace-nowrap"></button>
        <button id="header-chat" type="button" class="hidden w-8 h-8 rounded-full bg-slate-800 text-cyan-300 text-xs"><i class="fa-solid fa-comments" aria-hidden="true"></i></button>
        <button id="header-admin" type="button" class="hidden w-8 h-8 rounded-full bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs" aria-haspopup="dialog"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></button>
        <span id="header-level" class="text-xs font-bold text-violet-300 bg-violet-600/20 border border-violet-500/40 rounded-full px-3 py-1 whitespace-nowrap"></span>
      </div>
    </header>
    <div id="app-content" class="p-4 space-y-4 flex-1">
      <noscript>Aplikacja wymaga wlaczonego JavaScript.</noscript>
    </div>
    <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md grid grid-cols-5 gap-1 p-2 bg-[#0b1020]/95 backdrop-blur-xl border-t border-slate-800/80 z-30"></nav>
  </main>
</body>
</html>
